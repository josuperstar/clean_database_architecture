[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-database-architecture"
version = "0.1.0"
description = "Clean Architecture demo: list and rename shots across ShotGrid, ftrack, Kitsu (CLI, web, Qt)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
qt = ["PySide6>=6.6"]
shotgun = ["shotgun-api3>=3.4"]
ftrack = ["ftrack-python-api>=2.8"]
kitsu = ["gazu>=0.10"]
all = [
    "PySide6>=6.6",
    "shotgun-api3>=3.4",
    "ftrack-python-api>=2.8",
    "gazu>=0.10",
]

[project.scripts]
shots-cli = "framework_and_drivers.cli.main:run_cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: hits real vendor APIs (requires credentials)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
